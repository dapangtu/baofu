<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A股尾盘选股工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.1rem;color:#58a6ff}
button{background:#238636;color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:.85rem}
button:hover{background:#2ea043} button:disabled{opacity:.4;cursor:wait}
main{display:flex;gap:16px;padding:16px 24px;max-width:1600px;margin:0 auto;height:calc(100vh-58px)}
.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow-y:auto;padding:16px}
h2{font-size:.95rem;margin-bottom:12px;color:#8b949e}
#market-panel{flex:1}
.idx-grid{display:flex;gap:12px;margin-bottom:16px}
.idx-card{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;text-align:center}
.idx-card .ip{font-size:1.2rem;font-weight:700}
.bar{background:#21262d;border-radius:4px;height:20px;overflow:hidden;display:flex;margin:8px 0}
.bar span{display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff}
.bar .up{background:#f85149} .bar .flat{background:#484f58} .bar .down{background:#3fb950}
.red{color:#f85149} .green{color:#3fb950}
.tbl{width:100%;font-size:.8rem;border-collapse:collapse}
.tbl th{text-align:left;color:#8b949e;padding:3px 6px;border-bottom:1px solid #21262d}
.tbl td{padding:3px 6px;border-bottom:1px solid #21262d15}
#recommend-panel{flex:0 0 520px}
.card{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:10px;transition:.2s}
.card:hover{border-color:#58a6ff}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.rk{font-size:.75rem;color:#58a6ff;font-weight:700}
.sym{font-weight:600;font-size:.95rem}
.sc{font-size:1.05rem;font-weight:700;color:#d29922}
.ps{font-size:.75rem;color:#8b949e;margin:4px 0}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.tag{font-size:.68rem;padding:1px 6px;border-radius:10px}
.tag.bull{background:#1a3a2a;color:#3fb950} .tag.bear{background:#3a1a1a;color:#f85149}
.st{font-size:.78rem;color:#8b949e}
.loading{text-align:center;padding:40px;color:#8b949e}
.spin{width:24px;height:24px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
.eta{font-size:.7rem;color:#8b949e}
</style>
</head>
<body>
<header>
  <div><h1>A股尾盘选股工具</h1></div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="sta" id="status">连接中...</span>
    <button onclick="refresh()" id="refresh-btn">刷新</button>
  </div>
</header>
<main>
  <div class="panel" id="market-panel">
    <div id="market"><div class="loading"><div class="spin"></div></div></div>
  </div>
  <div class="panel" id="recommend-panel">
    <h2>个股推荐 <span class="eta" id="rec-time"></span></h2>
    <div id="recommend"><div class="loading"><div class="spin"></div><p>正在选股分析...</p></div></div>
  </div>
</main>
<script>
let allStocks=[],selTime='';

async function get(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}

// ---- 状态轮询 ----
async function pollState(){
  try{
    const s=await get('/api/state');
    document.getElementById('status').textContent=s.running?'分析中...':(s.stock_count>0?'就绪':'空闲');
    if(!s.running && s.stock_count>0 && s.updated_at !== selTime){
      selTime=s.updated_at;
      document.getElementById('rec-time').textContent=`(更新于 ${s.updated_at})`;
      loadRecommend();
    }
    if(!s.running && s.market_updated_at) loadMarket();
  }catch(e){}
  setTimeout(pollState, 3000);
}

// ---- 大盘概况 ----
let marketCache=null;
async function loadMarket(){
  try{
    const d=await get('/api/market');
    if(!d || JSON.stringify(d)===marketCache) return;
    marketCache=JSON.stringify(d);
    const el=document.getElementById('market');
    const idx=(d.indexes||[]).map(i=>{const nm={'SSE':'上证指数','SZSE':'深证成指','ChiNext':'创业板指'};const dn=nm[i.name]||i.name;return`<div class="idx-card"><div style="font-size:.78rem;color:#8b949e">${dn}</div><div class="ip">${(i.price||0).toLocaleString()}</div><div class="${(i.change_pct||0)>=0?'red':'green'}">${(i.change_pct||0)>=0?'+':''}${(i.change_pct||0).toFixed(2)}%</div></div>`}).join('');
    const t=(d.up_count||0)+(d.down_count||0)+(d.flat_count||0); const n=t||1;
    const up=((d.up_count||0)/n*100).toFixed(1), dn=((d.down_count||0)/n*100).toFixed(1), fl=((d.flat_count||0)/n*100).toFixed(1);
    const vol=(d.volume_top10||[]).map((v,i)=>`<tr><td>${i+1}</td><td>${v.code||''}</td><td>${v.name||''}</td><td class="${(v.change_pct||0)>=0?'red':'green'}">${(v.change_pct||0)>=0?'+':''}${(v.change_pct||0).toFixed(2)}%</td><td>${((v.volume||0)/10000).toFixed(0)}万手</td></tr>`).join('');
    el.innerHTML=`<h2>大盘概况 <span class="eta">${d.updated_at||''}</span></h2><div class="idx-grid">${idx}</div><div><div style="display:flex;justify-content:space-between;font-size:.82rem"><span>涨跌分布</span><span>${d.up_count||0} 涨 / ${d.down_count||0} 跌</span></div><div class="bar"><span class="up" style="width:${up}%">${up}%</span><span class="flat" style="width:${fl}%"></span><span class="down" style="width:${dn}%">${dn}%</span></div></div><h2 style="margin-top:12px">成交量 Top 10</h2><table class="tbl"><thead><tr><th>#</th><th>代码</th><th>名称</th><th>涨跌</th><th>成交量</th></tr></thead><tbody>${vol}</tbody></table>`;
  }catch(e){}
}

// ---- 个股推荐 ----
async function loadRecommend(){
  try{
    const d=await get('/api/recommend');
    allStocks=d.stocks||[];
    const el=document.getElementById('recommend');
    selTime=d.updated_at||'';
    document.getElementById('rec-time').textContent=`(更新于 ${selTime})`;
    if(!allStocks.length){el.innerHTML='<p style="color:#8b949e">暂无推荐，选股分析进行中...</p>';return}
    el.innerHTML=allStocks.map(s=>{
      const sigs=(s.indicators?.signal_summary||[]).map(t=>{const[n,dir]=t.split('=');const label={'ma':'均线','macd':'MACD','kdj':'KDJ','boll':'布林','rsi':'RSI','volume_ratio':'量比'}[n]||n;return`<span class="tag ${dir}">${label}${dir==='bull'?'✓':'✗'}</span>`}).join('');
      const concepts=(s.hot_concepts||[]).slice(0,3).map(c=>`<span class="tag" style="background:#1c2d3e;color:#58a6ff">${c}</span>`).join('');
      return`<div class="card"><div class="ch"><div><span class="rk">#${s.rank}</span> <span class="sym">${s.symbol} ${s.name}</span></div><span class="sc">${s.total_score.toFixed(1)}分</span></div><div class="ps">技术 ${s.tech_score.toFixed(0)}分 | 资金 ${s.money_score.toFixed(0)}分 | 概念 ${s.concept_score.toFixed(0)}分</div><div class="tags">${sigs}</div><div class="tags">${concepts}</div><div class="st">${(s.detail_items||[]).slice(0,3).join(' | ')}</div></div>`;
    }).join('');
  }catch(e){}
}

async function refresh(){
  const b=document.getElementById('refresh-btn');b.disabled=true;b.textContent='刷新中...';
  await fetch('/api/refresh',{method:'POST'});
  b.disabled=false;b.textContent='刷新';
}

// 初始化
pollState();
loadMarket();
loadRecommend();
</script>
</body>
</html>
